apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-privileged-and-host-namespaces
  annotations:
    policies.kyverno.io/title: Block Privileged Containers & Host Namespace Sharing
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers with hostPID, hostNetwork, hostIPC, or privileged: true can break
      out of container isolation and access the host kernel. This policy forbids them.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged containers are strictly forbidden. Remove 'securityContext.privileged: true'."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"

    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Sharing host namespaces (hostPID, hostIPC, hostNetwork) is strictly forbidden."
        pattern:
          spec:
            =(hostPID): "false"
            =(hostIPC): "false"
            =(hostNetwork): "false"
