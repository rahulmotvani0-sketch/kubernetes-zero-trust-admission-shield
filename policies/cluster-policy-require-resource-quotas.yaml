apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits-and-requests
  annotations:
    policies.kyverno.io/title: Enforce Resource Limits & Requests
    policies.kyverno.io/category: SRE & Multi-Tenancy Resilience
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers without CPU and Memory limits can consume all node resources,
      causing noisy neighbor issues and cluster instability.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-and-memory-bounds
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
      validate:
        message: "Every container must define CPU and memory requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
